name: Build and publish web installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO and esptool
        run: pip install platformio esptool
      - name: Build firmware
        run: pio run
      - name: Merge binaries into one image
        run: |
          B=.pio/build/cyd
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          mkdir -p site
          python -m esptool --chip esp32 merge_bin -o site/deskbuddy.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT" \
            0x10000 $B/firmware.bin
          cp web/index.html web/manifest.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
